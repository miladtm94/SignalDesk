server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://web-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # index.html names the hashed bundles of the current build, so the browser
    # must revalidate it on every load. Without this it may keep serving the
    # build it cached after the image is rebuilt.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Bundle names change with their content, so they can be cached for good.
    # A missing bundle is a 404, not index.html served as JavaScript.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
